<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrium Juegos | Guías y Novedades Gamer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">AJ <span>ATRIUMJUEGOS</span></a>
            <nav class="main-nav">
                <a href="index.html" class="active">Inicio</a>
                <a href="sobre-nosotros.html">Sobre Nosotros</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <div class="layout-principal">
        <main class="zona-contenido">
            <div class="blog-header">
                <h2>Artículos de Blog</h2>
                <div class="categories-tabs">
                    <button class="tab-categoria active" data-categoria="Todos">Todos</button>
                    <button class="tab-categoria" data-categoria="Guías">Guías Técnicas</button>
                    <button class="tab-categoria" data-categoria="Seguridad">Seguridad Digital</button>
                </div>
            </div>
            <div id="contenedor-articulos" class="articles-grid"></div>
        </main>

        <aside class="barras-laterales">
            <div class="widget-lateral">
                <h3>Buscar artículo</h3>
                <input type="text" placeholder="Buscar..." class="search-input">
            </div>
            <div class="widget-lateral">
                <h3>Recent Posts</h3>
                <ul id="lista-recientes"></ul>
            </div>
            <div class="widget-lateral">
                <h3>Calendario del mes</h3>
                <table class="calendario-tabla">
                    <thead>
                        <tr><th>L</th><th>M</th><th>X</th><th>J</th><th>V</th><th>S</th><th>D</th></tr>
                    </thead>
                    <tbody id="calendar-body"></tbody>
                </table>
            </div>
        </aside>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Atrium Juegos. Todos los derechos reservados.</p>
        <div class="footer-links">
            <a href="privacidad.html">Política de Privacidad</a>
            <a href="terminos.html">Términos y condiciones</a>
        </div>
    </footer>

    <script src="articulos.js"></script>
    <script src="script.js"></script>
</body>
</html>
