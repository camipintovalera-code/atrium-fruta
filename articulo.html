<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo Informativo | Atrium Juegos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">AJ <span>ATRIUMJUEGOS</span></a>
            <nav class="main-nav">
                <a href="index.html">Inicio</a>
                <a href="sobre-nosotros.html">Sobre nosotros</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="article-main">
        <article class="full-article">
            <div id="categoria-render" class="article-tag">Cargando...</div>
            <h1 id="titulo-render">Cargando título...</h1>
            <p id="fecha-render" class="article-date"></p>
            <hr class="article-divider">
            <div id="contenido-render" class="article-body">
                <!-- El contenido de AdSense se inyectará aquí -->
            </div>
        </article>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Atrium Juegos. Todos los derechos reservados.</p>
        <div class="footer-links">
            <a href="privacidad.html">Política de Privacidad</a>
            <a href="terminos.html">Términos y condiciones</a>
        </div>
    </footer>

    <script src="articulos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const idArticulo = params.get("id");

            const articuloData = articulos.find(a => a.id === idArticulo);

            if (articuloData) {
                document.getElementById("categoria-render").innerText = articuloData.categoria;
                document.getElementById("titulo-render").innerText = articuloData.titulo;
                document.getElementById("fecha-render").innerText = "Publicado el: " + articuloData.fecha;
                document.getElementById("contenido-render").innerHTML = articuloData.contenido;
                document.title = `${articuloData.titulo} | Atrium Juegos`;
            } else {
                document.getElementById("titulo-render").innerText = "Artículo no encontrado";
                document.getElementById("contenido-render").innerHTML = "<p>El artículo solicitado no existe o ha sido movido.</p><a href='index.html'>Volver al inicio</a>";
            }
        });
    </script>
</body>
</html>
